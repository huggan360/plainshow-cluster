# PlainShow's private network control plane. Install as
# /etc/headscale/config.yaml on the Raspberry Pi.
server_url: https://tailnet.plainshow.se
listen_addr: 127.0.0.1:10004
metrics_listen_addr: 127.0.0.1:10005
grpc_listen_addr: 127.0.0.1:10006
grpc_allow_insecure: false
trusted_proxies:
  - 127.0.0.1/32
  - ::1/128

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# Coordination stays on this Pi; relay/data traffic does not. Clients use the
# public DERP map only when they cannot establish a direct WireGuard path.
derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 3h

disable_check_updates: false
node:
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m
  routes:
    ha:
      probe_interval: 10s
      probe_timeout: 5s

database:
  type: sqlite
  debug: false
  gorm:
    prepare_stmt: true
    parameterized_queries: true
    skip_err_record_not_found: true
    slow_threshold: 1000
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
    wal_autocheckpoint: 1000

# Apache owns public TLS.
tls_cert_path: ""
tls_key_path: ""
acme_email: ""
tls_letsencrypt_hostname: ""

log:
  level: info
  format: text

# PlainShow's signed peer API enforces network membership. Headscale is the
# shared transport for authenticated PlainShow accounts.
policy:
  mode: file
  path: ""

dns:
  magic_dns: true
  base_domain: nodes.tailnet.plainshow.se
  override_local_dns: false
  nameservers:
    global: []
    split: {}
  search_domains: []
  extra_records: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false
taildrop:
  enabled: false
auto_update:
  enabled: false
