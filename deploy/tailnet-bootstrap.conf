<VirtualHost *:80>
    ServerName tailnet.plainshow.se
    Alias /.well-known/ "/var/lib/plainshow/publishing/domains/tailnet.plainshow.se/webroot/.well-known/"
    <Directory "/var/lib/plainshow/publishing/domains/tailnet.plainshow.se/webroot/.well-known">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/tailnet-error.log
    CustomLog ${APACHE_LOG_DIR}/tailnet-access.log combined
</VirtualHost>
