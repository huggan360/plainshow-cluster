<VirtualHost *:80>
    ServerName clusteradmin.plainshow.se
    Alias /.well-known/ "/var/lib/plainshow/publishing/domains/clusteradmin.plainshow.se/webroot/.well-known/"
    <Directory "/var/lib/plainshow/publishing/domains/clusteradmin.plainshow.se/webroot/.well-known">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/
    RewriteRule ^ https://clusteradmin.plainshow.se%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName clusteradmin.plainshow.se

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/clusteradmin.plainshow.se/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/clusteradmin.plainshow.se/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyPass /.well-known/ !
    RequestHeader set X-Forwarded-Proto "https"
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*) ws://127.0.0.1:10002/$1 [P,L]
    ProxyPass / http://127.0.0.1:10002/ retry=0
    ProxyPassReverse / http://127.0.0.1:10002/

    Header always set Strict-Transport-Security "max-age=31536000"
    ErrorLog ${APACHE_LOG_DIR}/clusteradmin-error.log
    CustomLog ${APACHE_LOG_DIR}/clusteradmin-access.log combined
</VirtualHost>
</IfModule>
