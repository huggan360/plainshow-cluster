<VirtualHost *:80>
    ServerName tailnet.plainshow.se
    Alias /.well-known/ "/var/lib/plainshow/publishing/domains/tailnet.plainshow.se/webroot/.well-known/"
    <Directory "/var/lib/plainshow/publishing/domains/tailnet.plainshow.se/webroot/.well-known">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/
    RewriteRule ^ https://tailnet.plainshow.se%{REQUEST_URI} [R=301,L,NE]
    ErrorLog ${APACHE_LOG_DIR}/tailnet-error.log
    CustomLog ${APACHE_LOG_DIR}/tailnet-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName tailnet.plainshow.se

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/tailnet.plainshow.se/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tailnet.plainshow.se/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass /.well-known/ !
    RequestHeader set X-Forwarded-Proto "https"
    # Apache limits literal upgrade protocol names to 15 characters. Headscale
    # uses "tailscale-control-protocol", so this dedicated vhost must accept
    # that backend upgrade through Apache's ANY sentinel.
    ProxyPass / http://127.0.0.1:10004/ upgrade=ANY retry=0 timeout=300
    ProxyPassReverse / http://127.0.0.1:10004/

    Header always set Strict-Transport-Security "max-age=31536000"
    ErrorLog ${APACHE_LOG_DIR}/tailnet-error.log
    CustomLog ${APACHE_LOG_DIR}/tailnet-access.log combined
</VirtualHost>
</IfModule>
