# Publish a release when a version tag is pushed.
#
# The asset names here are a contract with internal/updater: it looks for
# pscluster-<os>-<arch> and reads checksums.txt in sha256sum format. A release
# that does not carry an asset for a platform is invisible to nodes on it, so
# renaming these silently stops those machines updating.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      - name: Install native desktop build libraries
        run: sudo apt-get update && sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build native desktop
        run: make desktop && mv plainshow-cluster-desktop plainshow-cluster-desktop-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: plainshow-cluster-desktop-linux-${{ matrix.arch }}
          path: plainshow-cluster-desktop-linux-${{ matrix.arch }}
          if-no-files-found: error

  snap-package:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build classic Snap
        id: snapcraft
        uses: snapcore/action-build@v1
        with:
          path: .
      - uses: actions/upload-artifact@v4
        with:
          name: plainshow-cluster-snap-${{ matrix.arch }}
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

  release:
    needs: [desktop, snap-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # so `git describe` can see the tag

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The same gate that guards a commit guards a release. A build nobody can
      # roll back is the wrong place to discover a broken test.
      - name: Check
        run: make check

      - name: Build release assets
        run: make dist

      - uses: actions/download-artifact@v4
        with:
          pattern: plainshow-cluster-desktop-linux-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: plainshow-cluster-snap-*
          path: dist
          merge-multiple: true

      - name: Add desktop applications and snaps to checksums
        run: cd dist && sha256sum plainshow-cluster-desktop-linux-* plainshow-cluster_*.snap >> checksums.txt

      - name: Build complete portable installer bundles
        run: |
          set -eu
          for arch in amd64 arm64; do
            temporary="$(mktemp -d)"
            folder="plainshow-cluster-linux-$arch"
            bundle="$temporary/$folder"
            mkdir -p "$bundle/packaging/desktop"
            cp "dist/pscluster-linux-$arch" \
               "dist/plainshow-cluster-desktop-linux-$arch" \
               dist/install.sh dist/checksums.txt "$bundle/"
            cp packaging/desktop/plainshow-cluster.desktop \
               packaging/desktop/plainshow-cluster-*.png \
               "$bundle/packaging/desktop/"
            tar -czf "dist/plainshow-cluster-linux-$arch.tar.gz" -C "$temporary" "$folder"
            rm -rf "$temporary"
          done
          cd dist && sha256sum plainshow-cluster-linux-*.tar.gz >> checksums.txt

      - name: Verify the assets are what a node will look for
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          for asset in pscluster-linux-amd64 pscluster-linux-arm64 \
                       pscluster-admin-linux-amd64 pscluster-admin-linux-arm64 \
                       plainshow-cluster-desktop-linux-amd64 \
                       plainshow-cluster-desktop-linux-arm64 \
                       plainshow-cluster-linux-amd64.tar.gz \
                       plainshow-cluster-linux-arm64.tar.gz \
                       install.sh checksums.txt; do
            test -s "dist/$asset" || { echo "missing dist/$asset"; exit 1; }
          done
          test "$(find dist -maxdepth 1 -name 'plainshow-cluster_*.snap' | wc -l)" -eq 2 || {
            echo "expected one snap for amd64 and one for arm64"
            exit 1
          }
          # The binary must report the tag it was built from, or a node will
          # download this release forever and never consider itself current.
          reported="$(./dist/pscluster-linux-amd64 version || true)"
          echo "reported: $reported"
          case "$reported" in
            *"$version"*) ;;
            *) echo "binary reports '$reported', which does not contain '$version'"; exit 1 ;;
          esac
          cd dist && sha256sum -c checksums.txt

      # Deleting a tag does not delete its release, so a re-cut tag meets a
      # release that already exists and every publish attempt fails with
      # already_exists until somebody removes it by hand. Clear it first.
      - name: Remove any release left by a previous run of this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
                --jq .id 2>/dev/null || true)"
          if [ -n "${id:-}" ]; then
            echo "removing stale release $id for $GITHUB_REF_NAME"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          fi

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pscluster-linux-amd64
            dist/pscluster-linux-arm64
            dist/pscluster-admin-linux-amd64
            dist/pscluster-admin-linux-arm64
            dist/plainshow-cluster-desktop-linux-amd64
            dist/plainshow-cluster-desktop-linux-arm64
            dist/plainshow-cluster-linux-amd64.tar.gz
            dist/plainshow-cluster-linux-arm64.tar.gz
            dist/plainshow-cluster_*.snap
            dist/install.sh
            dist/checksums.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

  arch-package:
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: pacman -Syu --noconfirm git go nodejs npm gtk3 webkit2gtk-4.1

      - name: Build native pacman package
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          commit="$(printf '%.7s' "$GITHUB_SHA")"
          runuser -u builder -- env HOME=/home/builder \
            make VERSION="$GITHUB_REF_NAME" COMMIT="$commit" arch-package

      - name: Verify pacman package metadata
        run: |
          set -eu
          version="$(printf '%s' "${GITHUB_REF_NAME#v}" | sed 's/[^[:alnum:].+_]/./g')"
          package="dist/plainshow-cluster-$version-1-x86_64.pkg.tar.zst"
          test -s "$package"
          test "$(find dist -maxdepth 1 -name '*.pkg.tar.zst' | wc -l)" -eq 1
          bsdtar -xOf "$package" .PKGINFO | grep -Fx "pkgver = $version-1"
          unpack="$(mktemp -d)"
          bsdtar -xf "$package" -C "$unpack"
          "$unpack/usr/lib/plainshow-cluster/pscluster" version | grep -F "${GITHUB_REF_NAME#v}"

      - name: Attach pacman package
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pkg.tar.zst
            dist/arch-checksums.txt
          fail_on_unmatched_files: true
