name: arch-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package and publish
        required: true
        type: string
      commit:
        description: Commit SHA recorded in the package
        required: true
        type: string

permissions:
  contents: write

jobs:
  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install Arch build tools
        run: pacman -Syu --noconfirm git go nodejs npm gtk3 webkit2gtk-4.1

      - name: Build native pacman package
        run: |
          useradd --create-home builder
          commit="$(printf '%.7s' '${{ inputs.commit }}')"
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env HOME=/home/builder \
            make -C "$GITHUB_WORKSPACE" VERSION="${{ inputs.tag }}" COMMIT="$commit" arch-package

      - name: Verify pacman package metadata
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          version="$(printf '%s' '${{ inputs.tag }}' | sed 's/^v//; s/[^[:alnum:].+_]/./g')"
          package="dist/plainshow-cluster-$version-1-x86_64.pkg.tar.zst"
          test -s "$package"
          test "$(find dist -maxdepth 1 -name '*.pkg.tar.zst' | wc -l)" -eq 1
          bsdtar -xOf "$package" .PKGINFO | grep -Fx "pkgver = $version-1"

      - name: Publish Arch package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Plainshow Cluster ${{ inputs.tag }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(inputs.tag, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.pkg.tar.zst
            dist/arch-checksums.txt
